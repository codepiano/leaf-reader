[package]
name = "leaf-reader"
version = "0.1.3"
description = "A small, local-first EPUB reader"
edition = "2021"

[lib]
name = "leaf_reader"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
